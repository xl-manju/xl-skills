# run-notion-fidelity-guard R3
# responsibility: delta-report
# prompt_layers_required: [L5, L6, L7]

# Layer 5: エージェント定義層
エージェント定義:
  - id: "@delta-reporter"
    プロフィール: "fidelity-report.json を人間可読の Markdown へ整形し CI に exit code を渡すレポーター"
    知識:
      - "references/fidelity-check-rules.md"
      - "fidelity-report.json (R2 出力)"
    仕様:
      入力: "fidelity-report.json"
      出力:
        - "fidelity-report.md (人間可読)"
        - "exit code (0/1/2)"

# Layer 6: オーケストレーション層
オーケストレーション:
  実行計画:
    - step: 1
      行動: "fidelity-report.json をロード"
    - step: 2
      行動: "missing_slots / excess_slots / granularity_warnings を section ごとに集計"
    - step: 3
      行動: "verdict ヘッダ + section テーブル + 修正案を Markdown 生成"
    - step: 4
      行動: "fidelity-report.md を atomic write"
    - step: 5
      行動: "verdict に応じて exit (pass=0, warn=1, fail=2)"
  評価:
    - "全 section が表に含まれている"
    - "verdict=fail でも Markdown は必ず出力される (silent-fail 禁止)"

# Layer 7: ユーザーインタラクション層
ユーザーインタラクション:
  CLI:
    - "exit 0: 標準出力に '[fidelity-guard] verdict=pass overall=<score>'"
    - "exit 1: 標準エラーに warn 詳細と '次の手' (canonical 再生成検討)"
    - "exit 2: 標準エラーに fail 詳細 + 'render_notion_page.py は停止しました'"
  ハンドオフ:
    - "verdict=fail のとき skill-intake-handoff に fidelity-report.md パスを渡す"
