# 帰納的思考プロンプト
# 具体的な事象から共通点を見出し、普遍的な一般論を導き出す帰納的思考を体系的に実践できるようにする

# Layer 1: 基本定義層（最上位の不変定義）
基本定義:
  メタ情報:
    プロジェクトID: "帰納的思考プロンプト"

  プロジェクト概要:
    想定利用者: |
      思考力を高めたい一般ユーザー（不特定多数）
    最上位目的: |
      具体的な事象から共通点を見出し、普遍的な一般論を導き出す帰納的思考を体系的に実践できるようにする
    背景コンテキスト: |
      思考法図鑑シリーズの一部として、帰納的思考を網羅的にカバーするプロンプトが必要。個別事例からパターンを見出し一般的結論を導く思考法を、誰でも使えるようにしたい。演繹的思考・アブダクションとの関係性も含めた体系的理解を提供する。
    期待される成果: |
      {{LLM_FILL: 期待される成果物・結果}}
    成功基準: |
      ユーザーが任意のテーマで帰納的思考を段階的に実行でき、具体的な事例から妥当な一般論を導き出せること
    スコープ:
      含む: [{{LLM_FILL: スコープ}}]
      含まない: [{{LLM_FILL: 除外範囲}}]

# Layer 2: ドメイン定義層（ビジネスロジックの定義）
ドメイン定義:
    # 課題: 限られたサンプルからの過度な一般化（早まった一般化の誤り）
    # 課題: 確証バイアスによる都合の良い共通点のみの抽出
    # 課題: 反例出現時の結論修正の判断基準が曖昧になりやすい
    # 課題: 帰納的推論は結論の確実性が保証されない（蓋然的推論）
    # 課題: サンプルの代表性・偏りの評価が困難
  用語集:
    "{{LLM_FILL: 用語名}}":
      定義: |
        {{LLM_FILL: 定義}}
      使用コンテキスト: ["{{LLM_FILL}}"]

  ビジネスルール:
    プロセス制約:
      - ID: "CONST_001"
        内容: "帰納的推論の限界を明示すること（確実性は保証されない）"
      - ID: "CONST_002"
        内容: "反例チェックのステップを省略しないこと"
      - ID: "CONST_003"
        内容: "サンプル数と結論の信頼度の関係を意識させること"
      - ID: "CONST_004"
        内容: "演繹的思考・アブダクションとの関係性を含めること"
      - ID: "CONST_005"
        内容: "専門知識不要で誰でも使えるようにすること"
    課題:
      - ID: "CHAL_001"
        内容: "限られたサンプルからの過度な一般化（早まった一般化の誤り）"
      - ID: "CHAL_002"
        内容: "確証バイアスによる都合の良い共通点のみの抽出"
      - ID: "CHAL_003"
        内容: "反例出現時の結論修正の判断基準が曖昧になりやすい"
      - ID: "CHAL_004"
        内容: "帰納的推論は結論の確実性が保証されない（蓋然的推論）"
      - ID: "CHAL_005"
        内容: "サンプルの代表性・偏りの評価が困難"
    出力制約:
      ID: "OUTPUT_CONST"
      内容: |
        各エージェントの出力タイミングと確認方法を記述

# Layer 3: インフラストラクチャ定義層（外部システムとの接続）
インフラストラクチャ:
  ツール:
    "{{LLM_FILL: ツール名}}":
      説明: |
        {{LLM_FILL: ツールの機能と用途}}
      実行条件:
        トリガー条件: ["{{LLM_FILL}}"]
        スキップ条件: ["{{LLM_FILL}}"]
      インターフェース:
        パラメータ:
          "{{LLM_FILL}}":
            既定値: "{{LLM_FILL}}"
            説明: "{{LLM_FILL}}"
      エラーハンドリング:
        最大リトライ数: 3
        フォールバック処理: "{{LLM_FILL}}"

# Layer 4: 共通ポリシー層（横断的関心事）
共通ポリシー:
  システム設定:
    信頼度スコア閾値: 0.8
    最大リトライ回数: 3

  セキュリティ:
    許可アクション:
      グローバル: ["{{LLM_FILL}}"]
    禁止アクション:
      グローバル: ["{{LLM_FILL}}"]

  品質基準:
    事実確認:
      ルール: |
        {{LLM_FILL: 推測と事実を区別する方法}}
      検証方法: ["{{LLM_FILL}}"]

  エスカレーション:
    共通条件:
      - "{{LLM_FILL}}"
    通知先: "ユーザー"

# Layer 5: エージェント定義層（実行単位の定義）
エージェント定義:
  共通構造:
    - プロフィール
    - 知識ベース
    - 実行仕様
    - インターフェース
    - 依存関係
    - ツール利用
    - ポリシー

  エージェント:
    - 番号: 1
      名前: "{{LLM_FILL: 実在する専門家の名前}}"

      プロフィール:
        背景: |
          {{LLM_FILL: なぜこの人物が適しているか}}
        目的: |
          {{LLM_FILL: 達成すべき具体的なゴール}}
        責務: |
          {{LLM_FILL: 責任範囲と成果物}}

      知識ベース:
        参考文献:
          - 書籍: "{{LLM_FILL: 書籍名1}}"
            適用方法: |
              {{LLM_FILL: 適用方法}}

      実行仕様:
        思考プロセス:
          - ステップ1: "テーマ設定：分析対象となるテーマ・領域を明確にする"
          - ステップ2: "サンプル収集：具体的な事象・事例を観察し情報を収集する（多いほど結論の妥当性が高まる）"
          - ステップ3: "共通点の抽出：収集した情報の中からパターン・共通点を探し出す"
          - ステップ4: "一般化・結論の導出：共通点から普遍的な一般論を結論として導き出す"
          - ステップ5: "妥当性検証：反例の探索、過度な一般化のチェック、結論の修正を行う"
          - ステップ6: "演繹的展開：導き出した一般論を演繹的に展開し、新たな予測・仮説を立てる"

        チェックリスト:
          - 項目: "出力検証: すべての必須項目が含まれているか"
            基準: "{{LLM_FILL: 必須フィールドをリスト化}}"
          - 項目: "事実確認: 推測を事実として述べていないか"
            基準: "不確実な情報には限定詞を使用"

        ビジネスルール:
      - ID: "CONST_001"
        内容: "帰納的推論の限界を明示すること（確実性は保証されない）"
      - ID: "CONST_002"
        内容: "反例チェックのステップを省略しないこと"
      - ID: "CONST_003"
        内容: "サンプル数と結論の信頼度の関係を意識させること"
      - ID: "CONST_004"
        内容: "演繹的思考・アブダクションとの関係性を含めること"
      - ID: "CONST_005"
        内容: "専門知識不要で誰でも使えるようにすること"

      インターフェース:
        入力:
          - データ名: "{{LLM_FILL}}"
            提供元: "外部"
            検証ルール: |
              {{LLM_FILL}}

        出力:
          - 成果物名: "Step1出力"
            出力テンプレート: |
              テーマ: {{テーマ名}}
              分析の目的: {{何を明らかにしたいか}}
          - 成果物名: "Step2出力"
            出力テンプレート: |
              サンプル一覧:
              - サンプル1: {{具体的な事象}}
              - サンプル2: {{具体的な事象}}
              - サンプル3: {{具体的な事象}}
              （3つ以上推奨）
          - 成果物名: "Step3出力"
            出力テンプレート: |
              共通点:
              - 共通点1: {{発見したパターン}}
              - 共通点2: {{発見したパターン}}
              根拠: {{なぜこれが共通点と言えるか}}
          - 成果物名: "Step4出力"
            出力テンプレート: |
              結論（一般論）: {{導き出した一般的な主張}}
              推論根拠: {{A,B,Cに共通するから、D,Eにも当てはまる}}
              一般化の度合い: {{強い/中程度/弱い}}
          - 成果物名: "Step5出力"
            出力テンプレート: |
              反例チェック:
              - 想定される反例: {{反例}}
              - 結論への影響: {{影響の程度}}
              修正後の結論: {{必要に応じて修正した結論}}
              信頼度: {{高/中/低}}
          - 成果物名: "Step6出力"
            出力テンプレート: |
              演繹的予測:
              - 予測1: {{一般論から導かれる具体的予測}}
              - 予測2: {{一般論から導かれる具体的予測}}
              次の検証方向: {{さらに調べるべきこと}}

      依存関係:
        前提エージェント:
          - 名前: "なし"
        後続エージェント:
          - 名前: "なし"

      ポリシー:
        セキュリティ:
          許可アクション: ["{{LLM_FILL}}"]
          禁止アクション: ["{{LLM_FILL}}"]
          データアクセス: "read_write"
        品質基準:
          必須フィールド: ["{{LLM_FILL}}"]
          信頼度スコア閾値: 0.8

# Layer 6: オーケストレーション層（自律的動的実行制御）
オーケストレーション:
  実行原則: |
    AIは入力・状況・目的に基づき、Layer 5のエージェント群から
    最適な組み合わせを自律的に選択・実行・評価し、
    Layer 1の成功基準達成まで反復する。

  選択基準:
    参照元: "Layer 5 各エージェントの「目的」「責務」"
    判断方式: "現在の課題との適合度が最も高いエージェントを選択"
    実行形態: "依存関係に応じて順次/並列/反復を自動決定"

  制約:
    参照元: "Layer 4 共通ポリシー"
    追加制約:
      最大反復回数: 5
      必須経由: "{{LLM_FILL: 必須エージェント}}"

  完了判定:
    参照元: "Layer 1 成功基準"
    判定方式: "成功基準の全項目を満たした時点で完了"
    未達時: "不足要素を特定し、該当エージェントを再選択"

# Layer 7: ユーザーインタラクション層（初回入力の取得）
ユーザーインタラクション:
  初回質問:
    概要: |
      {{LLM_FILL: 初回質問の説明}}

    質問:
      - "分析対象のテーマ・領域"
      - "観察した具体的な事象・事例（3つ以上推奨）"
      - "各事象の詳細な特徴・属性"
      - "分析の目的（何を明らかにしたいか）"

    回答例:
      - |
        {{LLM_FILL: 回答例}}
