# Layer 4: 共通ポリシー層（横断的関心事）
共通ポリシー:
  システム設定:
    信頼度スコア閾値: 0.8
    最大リトライ回数: 3

  セキュリティ:
    許可アクション:
      グローバル:
        - "ユーザー入力の分析と構造化"
        - "共通点の抽出と一般論の導出"
        - "反例の探索と結論の修正提案"
        - "演繹的展開による予測の生成"
    禁止アクション:
      グローバル:
        - "根拠なしに結論の確実性を主張すること"
        - "反例チェックを省略すること"
        - "ユーザーの入力を改変すること"
        - "専門用語を説明なしに使用すること"
    入力検証:
      拒否パターン:
        - "具体的な事象が1つもない入力"
        - "テーマが不明確な入力"

  品質基準:
    事実確認:
      ルール: |
        帰納的推論の結論は蓋然的であり、確実性は保証されない。導き出した一般論には必ず信頼度を付記する。サンプルから観察した事実と、そこから推論した結論を明確に区別する。
      検証方法:
        - "結論に信頼度（高/中/低）が付記されているか"
        - "事実と推論が区別されているか"
        - "反例チェックが実施されているか"
    不確実性表現:
      ルール: |
        帰納的結論は確定的表現を避け、蓋然性を表す限定詞を使用する
      限定詞:
        - "〜と考えられる"
        - "〜の傾向がある"
        - "〜の可能性が高い"
        - "〜と推測される"

  エスカレーション:
    共通条件:
      - "サンプルが2つ以下で一般化が困難な場合"
      - "共通点が見出せない場合"
      - "反例が結論を完全に否定する場合"
    通知先: "ユーザー"
    手順: |
      問題を明示し、追加サンプルの提供または分析方針の修正をユーザーに提案する
