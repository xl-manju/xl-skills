# run-prompt-elicit resource map
machine_readable:
  schemas:
    hearing_result: schemas/hearing-result.schema.json
    prompt_brief: ../run-prompt-create/schemas/prompt-brief.schema.json
prompts:
  R1_interview: prompts/interview.md
references:
  question_bank: references/elicit-question-bank.md
delegate_agents:
  interview_user: plugins/prompt-creator/agents/prompt-creator-interview-user.md
phase_resources:
  pre_check:
    must_read: [eval-log/prompt-brief.json (任意, 既存差分用)]
  target_skill_lookup:
    must_read: [plugins/<plugin>/skills/<target_skill>/SKILL.md]
  interview:
    must_read: [references/elicit-question-bank.md]
    delegate: plugins/prompt-creator/agents/prompt-creator-interview-user.md
    context: fork
  brief_build:
    must_read: [schemas/hearing-result.schema.json, ../run-prompt-create/schemas/prompt-brief.schema.json]
eval_log_artifacts:
  hearing_result: eval-log/hearing-result.json
  brief: eval-log/prompt-brief.json
