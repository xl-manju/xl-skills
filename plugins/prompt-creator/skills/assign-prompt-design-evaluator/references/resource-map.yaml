    must_read: [references/prompt-rubric.json]
    scripts: [verify_completeness.js, validate_prompt.js]
  c1_c4_machine:
    must_read: [references/prompt-rubric.json]
  four_pass_llm:
    must_read: [references/c1-c4-criteria.md]
  emit_findings:
    must_read: [../run-prompt-create/schemas/findings.schema.json]
eval_log_artifacts:
  findings: eval-log/docs/<NN>-<timestamp>.json
