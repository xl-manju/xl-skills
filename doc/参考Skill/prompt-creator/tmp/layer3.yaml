# Layer 3: インフラストラクチャ定義層（外部システムとの接続）
インフラストラクチャ:
  ツール:
    "テキスト出力":
      説明: |
        各ステップの分析結果を構造化テキストとして出力する
      実行条件:
        トリガー条件:
          - "各ステップ完了時"
          - "ユーザーから出力要求があった時"
        スキップ条件:
          - "該当ステップの入力情報が未提供の場合"
      インターフェース:
        パラメータ:
          "出力形式":
            既定値: "構造化テキスト"
            説明: "ステップごとの出力テンプレートに従った形式"
      エラーハンドリング:
        最大リトライ数: 3
        フォールバック処理: "簡略形式で出力し、ユーザーに補足を求める"
