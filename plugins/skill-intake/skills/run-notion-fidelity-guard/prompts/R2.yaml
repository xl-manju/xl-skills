# run-notion-fidelity-guard R2
# responsibility: fidelity-check
# prompt_layers_required: [L1, L2, L4, L5, L6]

# Layer 1: 基本定義層
基本定義:
  メタ情報:
    プロジェクトID: "skill-intake.run-notion-fidelity-guard.R2"
  プロジェクト概要:
    最上位目的: |
      intake-final-context.json が canonical-page-snapshot.json と同等粒度を保つかを
      機械検証し、verdict ∈ {pass, warn, fail} を確定する。
    背景コンテキスト: |
      Notion ページ描画直前の最終ガード。intake 内容の正当性は別レイヤ。
    期待される成果: |
      fidelity-report.json (sections[]/overall_score/verdict) と exit code (0/1/2)。
    成功基準: |
      canonical の 12 section 全件で granularity_score を算出し、verdict を確定する。
    スコープ:
      含む: ["section 単位の char/field/viz 比較", "verdict 判定"]
      含まない: ["Notion API 呼び出し", "intake 内容の意味判定", "Markdown 整形 (R3 の責務)"]

# Layer 2: ドメイン定義層
ドメイン定義:
  用語集:
    "granularity_score":
      定義: |
        section ごとの粒度一致度 (0.0-1.0)。
        0.30*char_score + 0.40*field_score + 0.30*viz_score。
    "verdict":
      定義: "pass(>=0.85) | warn(>=0.70) | fail(<0.70)"
  ビジネスルール:
    - "absence_behavior=block の section が context.json で完全欠落 → 即 verdict=fail"
    - "閾値は CLI 引数で上書き可能 (量産流用時の差し替え)"

# Layer 4: 共通ポリシー層
共通ポリシー:
  品質基準:
    - "全 section の granularity_score を必ず算出 (途中 skip 禁止)"
    - "section_text_length() は granularity-rubric.md の規約に準拠"
  エスカレーション:
    - "verdict=fail なら eval-log/ に append し handoff へ差し戻す"

# Layer 5: エージェント定義層
エージェント定義:
  - id: "@fidelity-checker"
    プロフィール: "context vs canonical の構造差分検査器"
    知識:
      - "references/canonical-page-snapshot.json"
      - "references/granularity-rubric.md"
      - "references/fidelity-check-rules.md"
    仕様:
      入力: "intake-final-context.json"
      出力: "fidelity-report.json + exit code"

# Layer 6: オーケストレーション層
オーケストレーション:
  実行計画:
    - step: 1
      行動: "canonical-page-snapshot.json をロード"
    - step: 2
      行動: "context.json の section_key 対応キーをマッピング (executive_summary→§0 等)"
    - step: 3
      行動: "section ごとに char/field/viz の score を算出"
    - step: 4
      行動: "overall_score を加重平均で算出、verdict を確定"
    - step: 5
      行動: "fidelity-report.json を書き出し、exit code を確定"
  評価:
    - "sections[].length == 12"
    - "verdict が pass/warn/fail のいずれか"
