# CapabilityBundle 宣言 — plugins/skill-creator
# 正本スキーマ: skills/run-build-skill/references/capability-manifest.schema.json (kindPluginComposition)
# 用途: skill-creator 自身の dogfooding 兼、CapabilityBundle のリファレンス実装。

name: skill-creator
description: Claude Code Skill / Agent / Hook / Command / Composition / Prompt / Workflow の統一 Capability を作成・評価・統治するメタプラグイン。
kind: plugin-composition
version: 1.1.0
owner: team-platform
since: 2026-05-17
last-audited: 2026-05-22
# 単独配布非対応: marketplace / bundle には含めず、repo を clone した開発環境でのみ .claude/ symlink 経由で利用する。
distribution: repo-bundled

contract:
  intent: Claude Code 拡張資産(Capability)を一貫した品質で生成・改良するため、共通核 + kind 固有スキーマで統一抽象を提供する。
  interface:
    inputs: [user-request, plugin-composition.yaml, rubric.json]
    outputs: [CapabilityManifest, EVALS.json, lessons-learned/*.md, proposals/*.md]
  invariant:
    # enforcement 注記: 機械執行(lint/hook)がある項目はその名前を、無い項目は manual を併記する。
    - "全 Capability は CapabilityManifest を持ち kind を宣言すること (enforcement: hook:PostToolUse-EditWrite/lint-capability-manifest)"
    - "rubric_refs は L0→L1→L2 deep-merge 順を保つこと (enforcement: manual。skill-governance-lint/scripts/lint-rubric-refs-exist.py は存在のみ検証し順序は未検証)"
    - "elegant-review は Phase1(reset) → Phase2(3並列分析) → Phase3(改善) の順序を保つこと (enforcement: manual)"
    - "hook の副作用境界(side_effect_scope)は manifest 上で宣言されたもののみ (enforcement: manual)"
    - "cross-plugin 参照は repo clone 開発環境で存在確認できる internal plugin に限定すること。skill-creator / prompt-creator は marketplace / bundle 配布対象ではない (allowed_cross_plugins: skill-intake, skill-governance-lint, skill-governance-automation, skill-governance-config, skill-governance-migration, prompt-creator) (enforcement: skill-governance-lint/scripts/lint-external-refs.py --fail-on-external)"
    - "knowledge-loop は単一機構(ref-knowledge-loop 正本)を生成物(Loop A)と skill-creator 自身(Loop B)で自己適用し、並行ストアを作らないこと(SSOT) (enforcement: run-build-skill/scripts/lint-ssot-duplication.py + lint-knowledge-loop.py)"
    - "runtime hook script は自 plugin root 外を import-time に fail-closed 依存しないこと(必須共有モジュールは plugin 内へ vendoring し byte 一致 lint で正本と同期/ローダは fail-soft で raise しない)。単独 install でも全フックが exit 0 を維持する。参照: skills/ref-cross-platform-runtime/references/runtime-portability.md (enforcement: scripts/lint-runtime-portability.py + scripts/lint-vendored-ssot.py)"

capabilities:
  # === Skills (kind=skill) ===
  - { kind: skill, ref: skills/run-skill-create,            tier: core }
  - { kind: skill, ref: skills/run-skill-elicit,            tier: core }
  - { kind: skill, ref: skills/run-goal-elicit,             tier: core }
  - { kind: skill, ref: skills/run-goal-seek,               tier: core }
  - { kind: skill, ref: skills/run-build-skill,             tier: core }
  - { kind: skill, ref: skills/run-elegant-review,          tier: core }
  - { kind: skill, ref: skills/run-plugin-package-check,    tier: core }
  - { kind: skill, ref: skills/run-skill-rubric-governance, tier: core }
  - { kind: skill, ref: skills/run-skill-feedback,          tier: core }
  - { kind: skill, ref: skills/run-skill-rename,            tier: extension }
  - { kind: skill, ref: skills/run-skill-feedback,          tier: core }
  - { kind: skill, ref: skills/run-skill-update-notifier,   tier: extension }
  - { kind: skill, ref: skills/run-migrate-audit,           tier: extension }
  # contract-generator 由来の symlink skill は marketplace 単独 install で dangling するため
  # skill-creator の公開 capabilities には含めない。必要な場合は contract-generator plugin を
  # 別 dependency として install する。
  - { kind: skill, ref: skills/assign-skill-design-evaluator, tier: core }
  - { kind: skill, ref: skills/assign-plugin-package-evaluator, tier: core }
  - { kind: skill, ref: skills/delegate-codex-skill-review, tier: extension }
  - { kind: skill, ref: skills/wrap-git-commit-safe,        tier: extension }
  - { kind: skill, ref: skills/ref-pkg-contract,            tier: ref }
  - { kind: skill, ref: skills/ref-skill-design-rubric,     tier: ref }
  - { kind: skill, ref: skills/ref-domain-rubric-template,  tier: ref }
  - { kind: skill, ref: skills/ref-domain-task-spec-rubric, tier: ref }
  - { kind: skill, ref: skills/ref-skill-glossary,          tier: ref }
  - { kind: skill, ref: skills/ref-skill-naming-convention, tier: ref }
  - { kind: skill, ref: skills/ref-claude-code-skill-spec,  tier: ref }
  - { kind: skill, ref: skills/ref-cross-platform-runtime,  tier: ref }
  - { kind: skill, ref: skills/ref-output-routing,          tier: ref }
  - { kind: skill, ref: skills/ref-task-context-map,        tier: ref }
  - { kind: skill, ref: skills/ref-yaml-spec-fetcher,       tier: ref }
  - { kind: skill, ref: skills/ref-knowledge-loop,          tier: ref }

  # === Agents (kind=agent) ===
  - { kind: agent, ref: agents/run-build-skill-subagent,          tier: core }
  - { kind: agent, ref: agents/elegant-reset-observer,            tier: core }
  - { kind: agent, ref: agents/elegant-logical-structural-analyst, tier: core }
  - { kind: agent, ref: agents/elegant-meta-divergent-analyst,    tier: core }
  - { kind: agent, ref: agents/elegant-system-strategic-analyst,  tier: core }
  - { kind: agent, ref: agents/elegant-improvement-executor,      tier: core }

  # === Commands (kind=command) ===
  - { kind: command, ref: commands/install-bundle,    tier: extension }
  - { kind: command, ref: commands/capability-build,  tier: core }
  - { kind: command, ref: commands/capability-review, tier: core }
  - { kind: command, ref: commands/plugin-compose,    tier: core }
  - { kind: command, ref: commands/skill-improve,     tier: core }

  # === Hooks (kind=hook) — plugin.json 配線と1対1対応 ===
  - { kind: hook, ref: "hook:UserPromptSubmit/cache-refresh",         tier: extension }
  - { kind: hook, ref: "hook:PostToolUse-Skill/notify-skill-end",     tier: extension }
  - { kind: hook, ref: "hook:PostToolUse-Skill/auto-record-lesson",   tier: core }
  - { kind: hook, ref: "hook:PostToolUse-Skill/content-review-queue", tier: core }
  - { kind: hook, ref: "hook:PostToolUse-EditWrite/lint-capability-manifest", tier: core }
  - { kind: hook, ref: "hook:PostToolUse-EditWrite/content-review-queue", tier: core }
  - { kind: hook, ref: "hook:PostToolUse-Edit-rubric/diff-rubric-impact", tier: core }
  - { kind: hook, ref: "hook:PreToolUse-Bash/wrap-git-commit-safe",   tier: extension }
  - { kind: hook, ref: "hook:Stop/elegant-review-trigger",            tier: extension }
  - { kind: hook, ref: "hook:UserPromptSubmit/ref-task-context-map-preload", tier: extension }
  - { kind: hook, ref: "hook:SessionEnd/aggregate-evals",             tier: core }

