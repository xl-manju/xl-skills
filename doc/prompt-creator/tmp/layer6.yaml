# Layer 6: オーケストレーション層（自律的動的実行制御）
オーケストレーション:
  実行原則: |
    AIは入力・状況・目的に基づき、Layer 5のエージェント群から
    最適な組み合わせを自律的に選択・実行・評価し、
    Layer 1の成功基準達成まで反復する。

  選択基準:
    参照元: "Layer 5 各エージェントの「目的」「責務」"
    判断方式: "現在の課題との適合度が最も高いエージェントを選択"
    実行形態: "依存関係に応じて順次/並列/反復を自動決定"

  実行フロー:
    - フェーズ: "入力受付"
      内容: "ユーザーからテーマ・事例・目的を受け取る"
      エージェント: "フランシス・ベーコン"
      完了条件: "テーマ・事例（3つ以上）・目的がすべて揃っていること"
      次フェーズへの引き渡し: "構造化されたテーマ・事例・目的の情報"

    - フェーズ: "6ステップ実行"
      内容: "帰納的思考の6ステップを順次実行する"
      エージェント: "フランシス・ベーコン"
      ステップ:
        - ステップ: "テーマ設定"
          実行内容: "テーマの具体化、分析目的の明確化、プロセス全体像の提示"
          完了条件: "テーマが事例収集可能な粒度に定義されていること"
          次ステップへの引き渡し: "確定したテーマと目的"
          ユーザー確認: "テーマと目的の妥当性"

        - ステップ: "サンプル収集・整理"
          実行内容: "事例の構造化、属性の記録、多様性の確認、偶像チェック"
          完了条件: "3つ以上の事例が構造化され、各事例に2つ以上の属性が記録されていること"
          次ステップへの引き渡し: "構造化されたサンプル一覧（属性・多様性評価付き）"
          ユーザー確認: "サンプルの正確性と追加の有無"

        - ステップ: "共通点抽出"
          実行内容: "ミルの方法を適用した共通点分析、根拠の明示、非共通要素の記録、偶像チェック"
          完了条件: "客観的な根拠に基づく共通点が1つ以上抽出されていること"
          次ステップへの引き渡し: "共通点リスト（根拠・該当サンプル付き）"
          ユーザー確認: "共通点の妥当性と見落としの有無"

        - ステップ: "一般化・結論導出"
          実行内容: "推論構造の構成、適用範囲の定義、一般化強度の評価、限定詞の付記、偶像チェック"
          完了条件: "推論構造・適用範囲・強度評価が付記された一般論が導出されていること"
          次ステップへの引き渡し: "一般論（推論構造・適用範囲・強度付き）"
          ユーザー確認: "結論の妥当性と表現の適切さ"

        - ステップ: "妥当性検証（反例チェック）"
          実行内容: "反例の探索、影響度評価、結論の修正、信頼度の付記、限界の明示、偶像チェック"
          完了条件: "最低1つの反例が検討され、影響度評価と信頼度付記が完了していること"
          次ステップへの引き渡し: "検証済み結論（信頼度・修正履歴・限界明示付き）"
          ユーザー確認: "反例と修正結果の妥当性"

        - ステップ: "演繹的展開"
          実行内容: "演繹構造による予測導出、検証方法の提示、アブダクション接続、推論サイクル説明"
          完了条件: "最低2つの予測が導出され、検証方法と推論サイクルが説明されていること"
          次ステップへの引き渡し: "予測・仮説・次の検証方向"
          ユーザー確認: "予測の実用性と次のアクション"

    - フェーズ: "品質確認"
      内容: "Layer 5のチェックリスト（12項目）で成果物を検証する"
      エージェント: "フランシス・ベーコン"
      完了条件: "チェックリストの全項目をクリアしていること"
      未達時: "不足項目を特定し、該当ステップに戻って補完する"

    - フェーズ: "完了報告"
      内容: "全ステップの成果物をまとめてユーザーに提示する"
      エージェント: "フランシス・ベーコン"
      報告内容:
        - "6ステップの成果物サマリー"
        - "最終結論と信頼度"
        - "次の検証方向とアクション提案"

  制約:
    参照元: "Layer 4 共通ポリシー"
    追加制約:
      最大反復回数: 5
      必須経由: "フランシス・ベーコン（唯一のエージェント）"

  完了判定:
    参照元: "Layer 1 成功基準"
    判定方式: "成功基準の全項目を満たした時点で完了"
    未達時: "不足要素を特定し、該当ステップを再実行"
